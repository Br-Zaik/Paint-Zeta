name: Paint Zeta - Compilar APK

on:
  push:
    paths:
      - '*.zip'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extraer proyecto Android
        shell: bash
        run: |
          set -euo pipefail
          ZIP="$(find . -maxdepth 1 -type f -iname '*.zip' -print -quit)"
          if [ -z "$ZIP" ]; then
            echo 'ERROR: Sube un ZIP en la raiz del repositorio.'
            exit 1
          fi
          echo "Usando $ZIP"
          mkdir -p extracted output
          unzip -q "$ZIP" -d extracted
          SETTINGS="$(find extracted -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)"
          if [ -z "$SETTINGS" ]; then
            echo 'ERROR: El ZIP no contiene un proyecto Android Gradle.'
            exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$SETTINGS")" >> "$GITHUB_ENV"

      - name: Compilar APK Android
        shell: bash
        run: |
          set -o pipefail
          gradle -p "$PROJECT_DIR" :app:assembleDebug --no-daemon --console=plain 2>&1 | tee output/build.log

      - name: Preparar APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find "$PROJECT_DIR/app/build/outputs/apk/debug" -type f -name '*.apk' -print -quit)"
          if [ -z "$APK" ]; then
            echo 'ERROR: La compilacion no genero ninguna APK.'
            exit 1
          fi
          cp "$APK" output/Paint-Zeta-debug.apk

      - name: Descargar APK
        uses: actions/upload-artifact@v4
        with:
          name: Paint-Zeta-APK
          path: output/Paint-Zeta-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Guardar error para diagnostico
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Paint-Zeta-ERROR-LOG
          path: output/build.log
          if-no-files-found: ignore
          retention-days: 14
