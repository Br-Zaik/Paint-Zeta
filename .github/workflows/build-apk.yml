name: Paint Zeta - Compilar APK

on:
  push:
    paths:
      - '*.zip'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Extraer
        shell: bash
        run: |
          mkdir -p extracted output
          unzip -q -o Paint-Zeta-v8_8-Referencia-Color.zip -d extracted
          echo "PROJECT_DIR=extracted/PaintZeta" >> "$GITHUB_ENV"
      - name: Ver codigo exacto
        shell: bash
        run: |
          M="$PROJECT_DIR/app/src/main/java/com/pacco/animecut/MainActivity.java"
          C="$PROJECT_DIR/app/src/main/java/com/pacco/animecut/view/CanvasView.java"
          echo '=== MAIN 1120-1220 ==='; sed -n '1120,1220p' "$M"
          echo '=== MAIN 2320-2430 ==='; sed -n '2320,2430p' "$M"
          echo '=== MAIN 3280-3585 ==='; sed -n '3280,3585p' "$M"
          echo '=== CANVAS 5540-5825 ==='; sed -n '5540,5825p' "$C"
      - name: Compilar
        shell: bash
        run: gradle -p "$PROJECT_DIR" :app:assembleDebug --no-daemon --console=plain
