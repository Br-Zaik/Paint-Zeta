name: Paint Zeta v8.9
on:
  push:
    paths:
      - '.github/workflows/build-apk.yml'
      - 'tools/pz_v89_patch.py'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Preparar proyecto
        run: |
          set -e
          rm -rf extracted output
          mkdir -p extracted output
          unzip -q -o Paint-Zeta-v8_8-Referencia-Color.zip -d extracted
          python3 tools/pz_v89_patch.py
      - name: Compilar
        run: gradle -p extracted/PaintZeta :app:assembleDebug --no-daemon --console=plain
      - name: Entregables
        run: |
          set -e
          APK=$(find extracted/PaintZeta/app/build/outputs/apk/debug -type f -name '*.apk' -print -quit)
          test -n "$APK"
          cp "$APK" output/Paint-Zeta-v8_9-debug.apk
          cd extracted
          zip -qr ../output/Paint-Zeta-v8_9-Especial-Transform-Referencia.zip PaintZeta
      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: Paint-Zeta-v8_9-APK
          path: output/Paint-Zeta-v8_9-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Subir fuente
        uses: actions/upload-artifact@v4
        with:
          name: Paint-Zeta-v8_9-Source
          path: output/Paint-Zeta-v8_9-Especial-Transform-Referencia.zip
          if-no-files-found: error
          retention-days: 14
