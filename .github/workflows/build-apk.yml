name: Paint Zeta - Compilar APK

on:
  push:
    paths:
      - '*.zip'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Encontrar y extraer ZIP
        shell: bash
        run: |
          ZIP="$(find . -maxdepth 1 -type f -iname '*.zip' -print -quit)"

          if [ -z "$ZIP" ]; then
            echo "ERROR: No se encontro ningun ZIP"
            exit 1
          fi

          echo "ZIP seleccionado: $ZIP"

          mkdir -p extracted
          unzip -q "$ZIP" -d extracted

          PROJECT_FILE="$(find extracted -type f -name settings.gradle -print -quit)"

          if [ -z "$PROJECT_FILE" ]; then
            echo "ERROR: No se encontro el proyecto Android"
            exit 1
          fi

          echo "PROJECT_DIR=$(dirname "$PROJECT_FILE")" >> "$GITHUB_ENV"

      - name: Compilar APK Android
        shell: bash
        run: |
          gradle -p "$PROJECT_DIR" :app:assembleDebug --no-daemon --stacktrace

      - name: Preparar APK
        shell: bash
        run: |
          APK="$(find extracted -type f -path '*/app/build/outputs/apk/debug/*.apk' -print -quit)"

          if [ -z "$APK" ]; then
            echo "ERROR: No se genero APK"
            exit 1
          fi

          mkdir -p output
          cp "$APK" output/Paint-Zeta-debug.apk

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: Paint-Zeta-APK
          path: output/Paint-Zeta-debug.apk
          if-no-files-found: error
          retention-days: 14
