name: Paint Zeta - Compilar APK

on:
  push:
    paths:
      - '*.zip'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Extraer
        shell: bash
        run: |
          mkdir -p extracted output
          unzip -q -o Paint-Zeta-v8_8-Referencia-Color.zip -d extracted
          echo "PROJECT_DIR=extracted/PaintZeta" >> "$GITHUB_ENV"
      - name: Ver panel capas y helpers
        shell: bash
        run: |
          M="$PROJECT_DIR/app/src/main/java/com/pacco/animecut/MainActivity.java"
          echo '=== BUILD LAYERS MATCH ==='
          grep -n "buildLayersPanel\|layersPanel\|Capas\|smallAction" "$M" | head -n 120
          echo '=== MAIN 1900-2330 ==='; sed -n '1900,2330p' "$M"
          echo '=== MAIN 3520-3635 ==='; sed -n '3520,3635p' "$M"
      - name: Compilar
        shell: bash
        run: gradle -p "$PROJECT_DIR" :app:assembleDebug --no-daemon --console=plain
